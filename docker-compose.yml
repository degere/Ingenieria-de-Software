services:
  db:
    image: postgres:16-alpine
    container_name: postgres_cine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inacap
      POSTGRES_DB: cine_bd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: