{% extends "cine_nido/base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="contenedor">
  <section class="tarjeta auth" style="max-width:600px">
    <h1>Crear cuenta</h1>
    <p class="suave">Regístrate para comprar tus entradas más rápido.</p>
    <form method="post">
      {% csrf_token %}
      <div class="campo"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" required autocomplete="name"></div>
      <div class="campo"><label for="correo">Correo</label><input id="correo" type="email" name="correo" value="{{ correo }}" maxlength="150" required autocomplete="email"></div>
      <div class="campos-2">
        <div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" name="clave" required autocomplete="new-password"></div>
        <div class="campo"><label for="clave2">Repetir contraseña</label><input id="clave2" type="password" name="clave2" required autocomplete="new-password"></div>
      </div>
      <button class="btn btn-primario btn-bloque" type="submit">Crear cuenta</button>
    </form>
    <p class="centrado suave" style="margin-top:1rem">¿Ya tienes cuenta? <a href="{% url 'ingresar' %}">Ingresa</a></p>
  </section>
</div>
{% endblock %}
